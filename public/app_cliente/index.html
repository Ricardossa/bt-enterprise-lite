<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
    <title>BT Client Pro - Sua Barbearia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        :root {
            --bg: #081421;
            --card: #132238;
            --primary: #1565C0;
            --secondary: #1DB4FF;
            --success: #18C964;
            --text: #FFFFFF;
            --text2: #B8C7D9;
            --border: #1E3552;
            --radius: 25px;
        }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column; }

        /* App Layout */
        .app-header { padding: 50px 25px 20px; background: var(--bg); border-bottom: 1px solid var(--border); text-align: center; }
        .app-header img { height: 60px; margin-bottom: 10px; }

        .main-content { flex: 1; padding: 20px; overflow-y: auto; padding-bottom: 100px; }

        /* Loyalty Card */
        .card-fidelidade { background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%); border-radius: var(--radius); padding: 30px 20px; text-align: center; margin-bottom: 25px; box-shadow: 0 15px 30px rgba(0,0,0,0.3); }
        .points-val { font-size: 56px; font-weight: 900; line-height: 1; }
        .points-label { font-size: 11px; font-weight: 800; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; margin-top: 10px; }

        /* Action Buttons */
        .btn-main { width: 100%; padding: 25px; background: var(--card); border: 2px solid var(--border); border-radius: var(--radius); color: #fff; display: flex; align-items: center; gap: 20px; margin-bottom: 15px; cursor: pointer; transition: 0.2s; }
        .btn-main:active { transform: scale(0.96); border-color: var(--secondary); }
        .btn-main i { font-size: 32px; color: var(--secondary); }
        .btn-main div { text-align: left; }
        .btn-main b { display: block; font-size: 18px; }
        .btn-main span { font-size: 12px; color: var(--text2); }

        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: var(--card); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; padding-bottom: 15px; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 5px; color: var(--text2); font-size: 10px; font-weight: bold; opacity: 0.6; }
        .nav-item.active { color: var(--secondary); opacity: 1; }
        .nav-item i { font-size: 20px; }

        /* Screens */
        .screen { display: none; }
        .screen.active { display: block; }

        /* Anti-recursão e Ajustes Mobile */
        .hidden { display: none !important; }
        body.is-app .bottom-nav { display: none !important; }
        body.is-app .app-header { padding-top: 20px !important; }
    </style>
    <script>
        // Detecta se está dentro do APK
        if (window.self !== window.top || window.location.search.includes('is_app=true')) {
            document.documentElement.classList.add('is-app');
            window.addEventListener('DOMContentLoaded', () => document.body.classList.add('is-app'));
        }
    </script>
</head>
<body>

    <header class="app-header">
        <img id="unit-logo-header" src="https://api.brandaotech.com.br/uploads/logo/logo.png" alt="Logo">
        <div id="client-name" style="font-weight: 800; font-size: 14px;">Olá, Bem-vindo!</div>
    </header>

    <main class="main-content">

        <!-- TELA 1: HOME / FIDELIDADE -->
        <section id="home" class="screen active animate__animated animate__fadeIn">
            <!-- AGENDAMENTO ATIVO (Destaque v2.3) -->
            <div id="next-booking" class="hidden" style="background: rgba(245, 166, 35, 0.1); border: 2px solid var(--warning); border-radius: var(--radius); padding: 20px; margin-bottom: 25px; text-align: center;">
                <label style="color: var(--warning); font-size: 10px; font-weight: 900; text-transform: uppercase;">Você tem um horário hoje!</label>
                <div id="booking-time" style="font-size: 32px; font-weight: 900; margin: 5px 0;">--:--</div>
                <div id="booking-code" style="font-size: 14px; background: var(--warning); color: #000; display: inline-block; padding: 4px 15px; border-radius: 50px; font-weight: 900;">PIN: ---</div>
            </div>

            <div id="loyalty-card" class="card-fidelidade">
                <div class="points-val" id="user-points">0</div>
                <div class="points-label">Pontos Acumulados</div>
            </div>

            <div class="btn-main" onclick="App.go('agendar')">
                <i class="fa-solid fa-calendar-check"></i>
                <div>
                    <b>MARCAR HORÁRIO</b>
                    <span>Escolha data, hora e barbeiro</span>
                </div>
            </div>

            <div class="btn-main" onclick="App.go('promocoes')">
                <i class="fa-solid fa-tags"></i>
                <div>
                    <b>PROMOÇÕES</b>
                    <span>Confira as ofertas do dia</span>
                </div>
            </div>

            <div class="btn-main" onclick="App.go('perfil')">
                <i class="fa-solid fa-user-circle"></i>
                <div>
                    <b>MEU PERFIL</b>
                    <span>Meus dados e histórico</span>
                </div>
            </div>
        </section>

        <!-- TELA 2: AGENDAMENTO (NATIVO) -->
        <section id="agendar" class="screen animate__animated animate__fadeInRight">
            <button onclick="App.go('home')" style="background:none; border:none; color:var(--secondary); font-weight:bold; margin-bottom:20px;">← VOLTAR</button>
            <h2>Escolha o Profissional</h2>
            <div id="list-barbers" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <!-- Injetado via JS -->
            </div>
        </section>

        <!-- TELA 3: PROMOÇÕES -->
        <section id="promocoes" class="screen animate__animated animate__fadeInUp">
            <button onclick="App.go('home')" style="background:none; border:none; color:var(--secondary); font-weight:bold; margin-bottom:20px;">← VOLTAR</button>
            <h2>Ofertas Especiais</h2>
            <div id="list-promos">
                <!-- Injetado via JS -->
            </div>
        </section>

    </main>

    <nav class="bottom-nav">
        <div class="nav-item active" onclick="App.go('home')"><i class="fa-solid fa-house"></i><span>Início</span></div>
        <div class="nav-item" onclick="App.go('agendar')"><i class="fa-solid fa-calendar"></i><span>Agenda</span></div>
        <div class="nav-item" onclick="App.go('promocoes')"><i class="fa-solid fa-gift"></i><span>Prêmios</span></div>
        <div class="nav-item" onclick="App.go('perfil')"><i class="fa-solid fa-user"></i><span>Perfil</span></div>
    </nav>

    <script src="js/app.js?v=2.3.1"></script>
</body>
</html>
